services:
  - type: web
    name: apex-engine
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: LOCAL_AI_ENABLED
        value: "true"
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: USE_GEMINI_POLISH
        value: "true"
      - key: USE_OLLAMA_POLISH
        value: "false"
      - key: GEMINI_TIMEOUT_SECONDS
        value: "10.0"
      - key: GROK_MODEL
        value: grok-beta
      # Add secret API keys securely in the Render Dashboard Environment tab:
      # - GEMINI_API_KEY
      # - GROK_API_KEY

